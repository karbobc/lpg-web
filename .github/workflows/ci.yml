name: LPG Web CI

on:
  push:
    tags: [ "v*" ]
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-lgp-web:
    name: Build LPG Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies and build
        env:
          VITE_WEBSITE_TITLE: ${{ secrets.VITE_WEBSITE_TITLE }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lpg-web-artifact-${{ runner.os }}
          path: dist

  docker-build-and-push:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs:
      - build-lgp-web
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: docker_buildx

      - name: Docker meta
        uses: docker/metadata-action@v6
        id: docker_meta
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/lpg-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: lpg-web-artifact-${{ runner.os }}
          path: dist

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/386
          push: ${{ startsWith(github.event.ref, 'refs/tags/v') }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
